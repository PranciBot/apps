replicaCount: 1
image:
  registry:
  group:
  repository: chat-server
  pullPolicy: Never
  tag: 1.0-SNAPSHOT
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  className: kong
  annotations:
    konghq.com/strip-path: "true"
  hosts:
    - host: ""
      paths:
        - path: /chat-api
          pathType: Prefix
  tls: []
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: http
  hostnames:
  - chart-example.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
env:
  HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY: "drop-and-create"
  POSTGRES_USERNAME: "postgres"
  POSTGRES_PASSWORD: "password"
resources: {}
livenessProbe:
  httpGet:
    path: /healthz
    port: http
readinessProbe:
  httpGet:
    path: /healthz
    port: http
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

